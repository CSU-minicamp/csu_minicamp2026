<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目提交｜minicamp 2026</title><link rel="icon" type="image/png" href="assets/brand/minicamp-logo-seal.png"><link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="submission.css"></head><body class="profile-body" data-page="submission"><header id="site-header" class="site-header"></header><main class="profile-shell shell" hidden><section class="profile-header"><div><p class="section-kicker">SHIP / SUBMISSION</p><h1>把 Demo 交付出去。</h1><p>用几句话说清楚你们做了什么，主办方审核通过后，项目就会展示在 Gallery。</p></div><a class="outline-button submission-exit" href="gallery.html">退出提交 <span>↩</span></a></section><form id="project-form" class="admin-card project-form" novalidate><div class="form-intro"><p class="section-kicker">PROJECT DETAILS</p><h2>先让别人看懂你的项目。</h2><p>项目名称、问题和解决方案是必填内容；链接、封面和工具信息可以之后补充。</p></div><div class="field-grid"><label>项目名称<input name="projectName" required placeholder="例如：校园空闲教室共享助手（必填）"></label><label>项目主题<select name="theme"><option value="">请选择最贴合项目的主题（选填）</option><option>Reimagine Campus</option><option>Build for Humans</option><option>Create the Unexpected</option></select></label></div><label>一句话介绍<input name="tagline" required placeholder="用一句话说明项目为谁解决什么问题（必填）"></label><label>要解决的问题<textarea name="problem" required rows="4" placeholder="描述用户遇到的真实痛点、发生场景和影响（必填）"></textarea></label><label>你的解决方案<textarea name="solution" required rows="4" placeholder="说明产品如何解决问题、核心流程或关键功能（必填）"></textarea></label><div class="field-grid"><label>Demo 链接<input type="url" name="demoUrl" placeholder="粘贴可以直接打开的 Demo 地址（选填）"></label><label>GitHub 仓库<input type="url" name="githubUrl" placeholder="粘贴项目代码仓库地址（选填）"></label></div><label class="upload-field" for="cover-file"><span class="upload-field-copy"><strong>上传项目封面图（选填）</strong><small>选择一张能代表项目的图片，支持 JPG、PNG、WebP，最大 12MB。</small></span><input type="hidden" name="coverUrl"><input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp"><span id="cover-file-name" class="upload-file-name">尚未选择文件</span></label><label>AI Coding 工具<input name="aiTools" placeholder="例如：Codex、Cursor、Claude Code（选填）"></label><div id="member-fields"></div><p id="project-error" class="form-error" role="alert" aria-live="assertive"></p><button class="button button-primary" type="submit"><span class="submit-label">提交项目审核</span><span class="submit-arrow">↗</span></button></form></main><script src="api.js"></script><script src="nav.js"></script><script src="submission.js"></script>  <div id="participant-fab-root"></div>
  <script src="api.js"></script><script src="participant-fab.js"></script>
</body></html>
