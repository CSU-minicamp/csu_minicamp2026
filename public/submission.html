<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目提交｜minicamp 2026</title><link rel="icon" type="image/png" href="assets/brand/minicamp-logo-seal.png"><link rel="stylesheet" href="styles.css"></head><body class="profile-body" data-page="submission"><header id="site-header" class="site-header"></header><main class="profile-shell shell" hidden><section class="profile-header"><div><p class="section-kicker">SHIP / SUBMISSION</p><h1>把 Demo 交付出去。</h1><p>先保存草稿，确认内容后提交给主办方审核。</p></div></section><form id="project-form" class="admin-card project-form"><div class="field-grid"><label>项目名称 <em class="required-mark">必填</em><input name="projectName" required></label><label>主题 <em class="optional-mark">选填</em><select name="theme"><option>Reimagine Campus</option><option>Build for Humans</option><option>Create the Unexpected</option></select></label></div><label>一句话介绍 <em class="required-mark">必填</em><input name="tagline" required></label><label>Problem <em class="required-mark">必填</em><textarea name="problem" required rows="3"></textarea></label><label>Solution <em class="required-mark">必填</em><textarea name="solution" required rows="3"></textarea></label><div class="field-grid"><label>Demo URL <em class="optional-mark">选填</em><input type="url" name="demoUrl"></label><label>GitHub <em class="optional-mark">选填</em><input type="url" name="githubUrl"></label></div><label>封面图 <em class="optional-mark">选填</em><input type="hidden" name="coverUrl"><input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp"><small class="field-hint">支持 JPG、PNG、WebP；图片会自动压缩后上传。</small></label><label>AI Coding 工具 <em class="optional-mark">选填</em><input name="aiTools" placeholder="Codex, Cursor"></label><div id="member-fields"></div><p id="project-error" class="form-error"></p><button class="button button-primary" type="submit">提交项目</button></form></main><script src="api.js"></script><script src="nav.js"></script><script src="submission.js"></script>  <div id="participant-fab-root"></div>
