<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="minicamp 2026 个人主页：修改报名资料，查看活动通知和录取状态。">
  <title>个人主页｜minicamp 2026</title>
  <link rel="icon" type="image/png" href="assets/brand/minicamp-logo-seal.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-body" data-page="profile">
  <header id="site-header" class="site-header"></header>

  <main class="profile-shell shell">
    <section class="profile-login" id="profile-login">
      <div class="profile-login-copy">
        <p class="section-kicker">MY MINICAMP</p>
        <h1>你的报名，<br>由你继续更新。</h1>
        <p>使用申请编号和报名时填写的手机号或邮箱进入个人主页。你可以修改资料、补充作品集，并查看主办方发来的公告与审核通知。</p>
        <div class="profile-login-note"><span>01</span><p>报名编号会在提交成功页显示，也会发送到你的联系方式（正式版）。</p></div>
        <div class="profile-login-note"><span>02</span><p>每次修改都会记录最新提交时间，主办方可以看到资料更新。</p></div>
      </div>
      <form class="profile-login-card" id="profile-login-form" novalidate>
        <div class="profile-card-top"><span class="status-dot"></span>参与者登录</div>
        <h2>进入个人主页</h2>
        <p>使用报名时的申请编号和联系方式登录。</p>
        <label>申请编号<input id="login-id" required placeholder="例如 MC26-1005" autocomplete="username"><small class="field-help">在报名提交成功页可以看到，不是手机号。</small></label>
        <label>手机号或邮箱<input id="login-contact" required placeholder="报名时填写的联系方式" autocomplete="email"></label>
        <p class="profile-error" id="login-error" role="alert"></p>
        <button class="button button-dark" type="submit">继续进入 <span>↗</span></button>
        <small>还没有报名？<a href="index.html#apply">返回报名表</a></small>
      </form>
    </section>

  </main>
  <div class="toast" id="profile-toast" role="status"></div>
  <script src="api.js"></script><script src="nav.js"></script><script src="profile.js"></script>
</body>
</html>
