<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>组队工作区｜minicamp 2026</title><link rel="icon" type="image/png" href="assets/brand/minicamp-logo-seal.png"><link rel="stylesheet" href="styles.css"></head><body class="profile-body" data-page="team"><header id="site-header" class="site-header"></header><main class="profile-shell shell" hidden><section class="profile-header"><div><p class="section-kicker">MEET / TEAM UP</p><h1>把一个 Idea，变成一支队伍。</h1><p>现场会在黑板上产生方向；在这里查看开放队伍，找到合适的伙伴并确认 3–5 人队伍。</p></div><a class="button button-dark" href="profile.html">进入个人主页</a></section><section class="team-market admin-card"><div class="admin-card-head"><div><h2>Team Market</h2><p class="team-market-caption">我的队伍与可加入的队伍</p></div><span>3–5 人锁定</span></div><p class="team-market-intro">创建队伍或加入一支开放队伍，补齐 3–5 人后由队员确认。</p><p class="team-feedback" id="team-feedback" role="status" aria-live="polite"></p><div id="my-team" class="team-focus" aria-live="polite"></div><form id="create-team-form" class="team-create-form"><label>队伍暂定名称<input name="projectName" required maxlength="80" placeholder="例如：校园好去处发现计划"></label><small>创建后会生成队伍邀请码，可以在补齐 3–5 人后锁定。</small><button class="button button-dark" type="submit">创建我的队伍</button></form><form id="join-by-code-form" class="team-code-form"><div><strong>收到队伍邀请吗？</strong><small>粘贴队长发来的邀请码，无需在队伍列表中查找。</small></div><label class="sr-only" for="team-invite-code">队伍邀请码</label><div class="input-action"><input id="team-invite-code" name="code" required autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="16" placeholder="例如 MC26-A7K2"><button type="submit">凭码加入</button></div></form><div class="team-market-list-head"><h3>正在招募的队伍</h3><span>加入后需补齐 3–5 人才能锁定</span></div><div id="team-list" class="team-board compact"></div></section></main><script src="api.js"></script><script src="nav.js"></script><script src="team.js"></script></body></html>
