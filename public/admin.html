<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主办方工作台｜minicamp 2026</title>
  <link rel="icon" type="image/png" href="assets/brand/minicamp-logo-seal.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="index.html" aria-label="返回 minicamp 2026 首页"><span class="admin-brand-mark"><img src="assets/brand/minicamp-logo-seal.png" alt="" width="1254" height="1254"></span><span>minicamp <b>2026</b></span><i class="admin-badge">ADMIN</i></a>
      <nav class="admin-nav" aria-label="后台导航">
        <button class="active" type="button" data-panel="overview"><span>01</span><b>报名总览</b></button>
        <button type="button" data-panel="applicants"><span>02</span><b>报名审核</b></button>
        <button type="button" data-panel="teams"><span>03</span><b>队伍管理</b></button>
        <button type="button" data-panel="ideas"><span>04</span><b>Idea 管理</b></button>
        <button type="button" data-panel="projects"><span>05</span><b>项目审核</b></button>
        <button type="button" data-panel="voting"><span>06</span><b>投票与结果</b></button>
        <button type="button" data-panel="notices"><span>07</span><b>通知与录取</b></button>
        <button type="button" data-panel="config"><span>08</span><b>活动配置</b></button>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="index.html">← 返回官网</a>
        <div class="admin-user"><span class="admin-avatar">主</span><div><strong>主办方团队</strong><small>报名阶段</small></div></div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div><h1 id="admin-title">报名总览</h1><p id="admin-subtitle">集中管理报名、审核、录取与通知。</p></div>
        <span class="prototype-pill">主办方工作台</span>
      </div>

      <section class="admin-panel active" id="panel-overview">
        <div class="metrics-grid" id="metrics-grid"></div>
        <div class="dashboard-grid">
          <div class="admin-card"><div class="admin-card-head"><h2>报名状态</h2><button data-switch="applicants">查看全部 →</button></div><div class="status-bars" id="status-bars"></div></div>
          <div class="admin-card"><div class="admin-card-head"><h2>最近报名</h2><span>实时</span></div><div class="activity-list" id="activity-list"></div></div>
        </div>
        <div class="dashboard-grid">
          <div class="admin-card"><div class="admin-card-head"><h2>能力结构</h2><span>报名者自选标签</span></div><div class="status-bars" id="skill-bars"></div></div>
          <div class="admin-card"><div class="admin-card-head"><h2>关键节点</h2><span>来自活动配置</span></div><div class="activity-list" id="event-reminders"></div></div>
        </div>
      </section>

      <section class="admin-panel" id="panel-applicants">
        <div class="panel-toolbar"><div class="toolbar-left"><input class="admin-search" id="applicant-search" placeholder="搜索姓名 / 学院 / 专业 / 申请编号 / 联系方式"><select class="admin-select" id="applicant-status"><option value="全部">全部状态</option><option value="待审核">待审核</option><option value="已录取">已录取</option><option value="候补">候补</option><option value="待复审">待复审</option></select></div><div class="toolbar-right"><button class="outline-button" id="export-csv">导出 CSV</button><button class="outline-button primary" id="refresh-data">刷新数据</button></div></div>
        <div class="table-wrap"><table class="data-table"><thead><tr><th>申请人</th><th>申请编号</th><th>联系方式</th><th>能力标签</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="applicants-table"></tbody></table></div>
      </section>

      <section class="admin-panel" id="panel-notices">
        <div class="notice-admin-layout">
          <form class="admin-card notice-compose" id="notice-form">
            <div class="admin-card-head"><h2>发送通知 / 录取结果</h2><span>写入报名者收件箱</span></div>
            <label>通知类型<select name="type"><option>活动公告</option><option>报名进度</option><option>录取结果</option><option>资料复核</option><option>现场提醒</option></select></label>
            <label>发送对象<select name="target" id="notice-target"><option value="ALL">所有报名者</option></select></label>
            <label>标题<input name="title" required placeholder="例如：minicamp 2026 录取结果通知"></label>
            <label>内容<textarea name="body" required rows="6" placeholder="写下报名者需要知道的事情"></textarea></label>
            <button class="button button-dark" type="submit">发布通知 <span>↗</span></button>
          </form>
          <div class="admin-card"><div class="admin-card-head"><h2>已发布通知</h2><span id="notice-total">0 条</span></div><div class="admin-notice-list" id="admin-notice-list"></div></div>
        </div>
      </section>

      <section class="admin-panel" id="panel-teams">
        <div class="admin-card"><div class="admin-card-head"><h2>队伍状态</h2><span id="team-total">0 支队伍</span></div><div class="team-board" id="admin-team-board"></div></div>
      </section>

      <section class="admin-panel" id="panel-ideas">
        <div class="admin-card"><div class="admin-card-head"><h2>Idea Board</h2><span>关闭后不再出现在组队页</span></div><div class="idea-list" id="admin-idea-list"></div></div>
      </section>

      <section class="admin-panel" id="panel-projects">
        <div class="admin-card"><div class="admin-card-head"><h2>项目审核</h2><span id="project-total">0 个项目</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>项目</th><th>队伍</th><th>主题</th><th>Demo</th><th>状态</th><th>操作</th></tr></thead><tbody id="projects-table"></tbody></table></div></div>
      </section>

      <section class="admin-panel" id="panel-voting">
        <div class="vote-summary" id="vote-summary"></div>
        <div class="admin-card"><div class="admin-card-head"><h2>奖项结果</h2><span>参与者与 Jury 权重合并</span></div><div class="vote-list" id="vote-results"></div></div>
      </section>

      <section class="admin-panel" id="panel-config">
        <div class="admin-card" id="config-editor"></div>
      </section>
    </main>
  </div>

  <dialog id="applicant-modal" class="application-modal admin-detail-modal" aria-labelledby="applicant-detail-name">
    <button class="modal-close" id="applicant-modal-close" type="button" aria-label="关闭详情">×</button>
    <div id="applicant-detail"></div>
  </dialog>

  <div class="toast" id="admin-toast" role="status"></div>
  <script src="api.js"></script><script src="admin.js"></script>
</body>
</html>
