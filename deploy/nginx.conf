# =============================================================
# minicamp 2026 报名页面 · Nginx 反向代理配置
# -------------------------------------------------------------
# 作用：解决前端请求 /api/* 返回 404 的问题——把域名的请求转发到
#       本机正在运行的 Node 服务（默认 127.0.0.1:4173）。
#
# 前置条件：
#   1. Node 服务已在服务器本机启动并常驻：
#        node server.mjs
#      （建议用 pm2 / systemd / nssm 守护，见文件末尾）
#   2. Node 默认监听 127.0.0.1:4173（server.mjs 已写死绑定本机，
#      仅通过 Nginx 对外，安全）。如需换端口：
#        set MINICAMP_PORT=xxxx   (Windows)
#        export MINICAMP_PORT=xxxx (Linux)
#
# 使用步骤：
#   1. 把下面的 server 块放进 Nginx 配置（或站点 conf），改好 server_name。
#   2. 校验并重载：  nginx -t && nginx -s reload
#   3. 用域名打开 /profile.html，登录不再报 404 即成功。
#
# 宝塔面板用户：
#   在“网站 → 你的站点 → 反向代理”里新增，
#   目标 URL 填  http://127.0.0.1:4173  ，发送域名填 $host，
#   代理目录填 /  即可（等价于下方“方案 A”）。
# =============================================================

server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    # 上传报名资料体积很小，这里给个宽松上限即可
    client_max_body_size 5m;

    # -------- 方案 A（推荐）：全部交给 Node 服务 --------
    # Node 同时负责静态页面(index/profile 等)和 /api 接口，
    # 全量转发最省心，路径不会错配。
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -------- 方案 B（可选）：Nginx 直接托管静态文件，只反代 /api --------
    # 若你希望由 Nginx 直接发静态文件（更快），删掉上面的 location /，
    # 改用下面两段，并把 root 指向仓库里的 public 目录：
    #
    # root /var/www/csu_minicamp2026/public;   # ← 改成你的 public 绝对路径
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:4173;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# -------------------------------------------------------------
# HTTPS（建议正式上线启用，证书可用 certbot / 宝塔一键申请）：
#   把 listen 80; 改为 443 ssl; 并补充证书路径，再加一个 80 端口
#   的 server 做 301 跳转到 https 即可。
# -------------------------------------------------------------

# -------------------------------------------------------------
# 让 Node 常驻的三种方式（任选其一）：
#   Linux + pm2 :   npm i -g pm2 && pm2 start server.mjs --name minicamp
#   Linux + systemd: 写一个 minicamp.service，ExecStart=node /path/server.mjs
#   Windows + nssm : nssm install minicamp "C:\Program Files\nodejs\node.exe" server.mjs
# -------------------------------------------------------------
